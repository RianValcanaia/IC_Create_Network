networks:
  FabricNetwork:
    external: true
    name: FabricNetwork_net
services:
  ca-org1:
    image: hyperledger/fabric-ca:1.5.13
    labels:
      service: hyperledger-fabric-ca
    container_name: ca-org1
    environment:
    - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
    - FABRIC_CA_SERVER_CA_NAME=ca-org1
    - FABRIC_CA_SERVER_TLS_ENABLED=false
    - FABRIC_CA_SERVER_PORT=8054
    - FABRIC_CA_SERVER_CSR_CN=ca-org1
    - FABRIC_CA_SERVER_CSR_HOSTS=0.0.0.0
    ports:
    - 8054:8054
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
    - ../organizations/fabric-ca/Org1:/etc/hyperledger/fabric-ca-server
    networks:
    - FabricNetwork
  ca-org2:
    image: hyperledger/fabric-ca:1.5.13
    labels:
      service: hyperledger-fabric-ca
    container_name: ca-org2
    environment:
    - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
    - FABRIC_CA_SERVER_CA_NAME=ca-org2
    - FABRIC_CA_SERVER_TLS_ENABLED=false
    - FABRIC_CA_SERVER_PORT=9054
    - FABRIC_CA_SERVER_CSR_CN=ca-org2
    - FABRIC_CA_SERVER_CSR_HOSTS=0.0.0.0
    ports:
    - 9054:9054
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
    - ../organizations/fabric-ca/Org2:/etc/hyperledger/fabric-ca-server
    networks:
    - FabricNetwork
  ca-orderer:
    image: hyperledger/fabric-ca:1.5.13
    labels:
      service: hyperledger-fabric-ca
    container_name: ca-orderer
    environment:
    - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
    - FABRIC_CA_SERVER_CA_NAME=ca-orderer
    - FABRIC_CA_SERVER_TLS_ENABLED=false
    - FABRIC_CA_SERVER_PORT=7054
    - FABRIC_CA_SERVER_CSR_CN=ca-orderer
    - FABRIC_CA_SERVER_CSR_HOSTS=0.0.0.0
    ports:
    - 7054:7054
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
    - ../organizations/fabric-ca/ordererOrg:/etc/hyperledger/fabric-ca-server
    networks:
    - FabricNetwork
