networks:
  FabricNetwork:
    external: true
    name: FabricNetwork_net
services:
  ca-org3:
    image: hyperledger/fabric-ca:1.5.13
    labels:
      service: hyperledger-fabric-ca
    container_name: ca-org3
    environment:
    - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
    - FABRIC_CA_SERVER_CA_NAME=ca-org3
    - FABRIC_CA_SERVER_TLS_ENABLED=false
    - FABRIC_CA_SERVER_PORT=10054
    - FABRIC_CA_SERVER_CSR_CN=ca-org3
    - FABRIC_CA_SERVER_CSR_HOSTS=0.0.0.0
    ports:
    - 10054:10054
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
    - ../organizations/fabric-ca/Org3:/etc/hyperledger/fabric-ca-server
    networks:
    - FabricNetwork
  ca-org4:
    image: hyperledger/fabric-ca:1.5.13
    labels:
      service: hyperledger-fabric-ca
    container_name: ca-org4
    environment:
    - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
    - FABRIC_CA_SERVER_CA_NAME=ca-org4
    - FABRIC_CA_SERVER_TLS_ENABLED=false
    - FABRIC_CA_SERVER_PORT=11054
    - FABRIC_CA_SERVER_CSR_CN=ca-org4
    - FABRIC_CA_SERVER_CSR_HOSTS=0.0.0.0
    ports:
    - 11054:11054
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
    - ../organizations/fabric-ca/Org4:/etc/hyperledger/fabric-ca-server
    networks:
    - FabricNetwork
