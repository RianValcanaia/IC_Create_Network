    - ORDERER_METRICS_PROVIDER=prometheus
    - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:9211
    - ORDERER_OPERATIONS_TLS_ENABLED=false
    working_dir: /root
    command: orderer
    volumes:
    - ../organizations/ordererOrganizations/exemplo.com/orderers/orderer0.exemplo.com/msp:/var/hyperledger/orderer/msp
    - ../organizations/ordererOrganizations/exemplo.com/orderers/orderer0.exemplo.com/tls/:/var/hyperledger/orderer/tls
    - orderer0.exemplo.com:/var/hyperledger/production/orderer
    ports:
    - 7060:7060
    - 7061:7061
    - 9211:9211
    networks:
    - FabricNetwork
    extra_hosts:
    - orderer2.exemplo.com:10.10.20.152
    - orderer3.exemplo.com:10.10.20.152
    - peer0.Org3.exemplo.com:10.10.20.152
